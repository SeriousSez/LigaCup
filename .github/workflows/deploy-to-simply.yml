name: Deploy to Simply.com

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22.x"
  PROJECT_PATH: "LigaCup.API/LigaCup.API.csproj"
  PUBLISH_PATH: "./publish"
  # Simply.com runs the IIS application pool in 32-bit mode.
  RUNTIME_IDENTIFIER: "win-x86"
  ANGULAR_WORKING_DIR: "./ligacup-web"
  ANGULAR_DIST_PATH: "./ligacup-web/dist/ligacup-web/browser"
  API_SERVER_DIR: "/ligacup.api/"
  WEB_SERVER_DIR: "/ligacup/"
  # Used when the WEB_ORIGIN and API_ORIGIN repository variables are not set.
  DEFAULT_WEB_ORIGIN: "https://ligacup.sezginsahin.dk"
  DEFAULT_API_ORIGIN: "https://ligacup.api.sezginsahin.dk"
  # Encrypts the FTP session. Change to "ftp" only if the host refuses TLS.
  FTP_PROTOCOL: "ftps"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.changes.outputs.api }}
      web: ${{ steps.changes.outputs.web }}
    steps:
      - uses: actions/checkout@v5

      - name: Detect file changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            api:
              - 'LigaCup.API/**'
              - 'LigaCup.ApplicationService/**'
              - 'LigaCup.Infrastructure/**'
              - 'LigaCup.Domain/**'
              - 'LigaCup.Domain.Tests/**'
              - 'Directory.Build.props'
              - 'LigaCup.slnx'
              - '.github/workflows/deploy-to-simply.yml'
            web:
              - 'ligacup-web/**'

  test:
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run domain tests
        run: dotnet test LigaCup.Domain.Tests --configuration Release

  build-api:
    needs: [detect-changes, test]
    if: needs.detect-changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Generate production appsettings from secrets
        working-directory: ./LigaCup.API
        shell: pwsh
        env:
          JWT_KEY: ${{ secrets.JWT_KEY }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
          API_ORIGIN: ${{ vars.API_ORIGIN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:JWT_KEY) -or $env:JWT_KEY.Length -lt 32) {
            throw "The JWT_KEY secret must be set and at least 32 characters long."
          }

          $origin = if ([string]::IsNullOrWhiteSpace($env:WEB_ORIGIN)) { '${{ env.DEFAULT_WEB_ORIGIN }}' } else { $env:WEB_ORIGIN }
          $apiOrigin = if ([string]::IsNullOrWhiteSpace($env:API_ORIGIN)) { '${{ env.DEFAULT_API_ORIGIN }}' } else { $env:API_ORIGIN }
          $origin = $origin.Trim().TrimEnd('/').TrimEnd('.')
          $apiOrigin = $apiOrigin.Trim().TrimEnd('/').TrimEnd('.')

          # Rejects requests arriving with an unexpected Host header.
          $apiHost = ([Uri]$apiOrigin).Host

          $config = @{
            Database          = @{ Provider = 'Sqlite' }
            ConnectionStrings = @{ LigaCupSqlite = 'Data Source=App_Data/ligacup.db' }
            Jwt               = @{
              Issuer        = 'LigaCup'
              Audience      = 'LigaCup.Clients'
              Key           = $env:JWT_KEY
              ExpiryMinutes = 60
              RefreshExpiryDays = 30
            }
            Admin             = @{
              Username = $env:ADMIN_USERNAME
              Password = $env:ADMIN_PASSWORD
              Email    = $env:ADMIN_EMAIL
            }
            Cors              = @{ AllowedOrigins = @($origin) }
            Logging           = @{ LogLevel = @{ Default = 'Warning'; 'LigaCup' = 'Information' } }
            AllowedHosts      = '*'
          }

          $config | ConvertTo-Json -Depth 6 | Set-Content -Path 'appsettings.Production.json' -Encoding UTF8

      - name: Publish API
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          --configuration Release
          --runtime ${{ env.RUNTIME_IDENTIFIER }}
          --self-contained true
          -p:CopyLocalLockFileAssemblies=true
          --output ${{ env.PUBLISH_PATH }}

      - name: Verify API artifact
        shell: pwsh
        run: |
          $publishDir = '${{ env.PUBLISH_PATH }}'
          foreach ($required in @('LigaCup.API.exe', 'web.config', 'appsettings.Production.json')) {
            if (-not (Test-Path (Join-Path $publishDir $required))) {
              throw "Missing $required in publish output."
            }
          }

          $webConfig = Get-Content (Join-Path $publishDir 'web.config') -Raw
          if ($webConfig -notmatch 'processPath="\.\\LigaCup\.API\.exe"') {
            throw 'web.config processPath is not set to .\LigaCup.API.exe.'
          }
          if ($webConfig -notmatch 'hostingModel="OutOfProcess"') {
            throw 'web.config hostingModel is not OutOfProcess.'
          }

          # A .db in the publish output would be uploaded and could clobber live results.
          $strays = Get-ChildItem -Path $publishDir -Recurse -Include *.db, *.db-wal, *.db-shm -File
          if ($strays) {
            $strays | ForEach-Object { Write-Host "Removing $($_.FullName)" }
            $strays | Remove-Item -Force
          }

          $configPath = Join-Path '${{ env.PUBLISH_PATH }}' 'appsettings.Production.json'
          $json = Get-Content $configPath -Raw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($json.Jwt.Key)) { throw 'Published config has an empty JWT key.' }
          if ($json.Database.Provider -ne 'Sqlite') { throw 'Published config must pin the provider to Sqlite.' }
          if ([string]::IsNullOrWhiteSpace($json.Cors.AllowedOrigins)) { throw 'Published config has no CORS origin.' }

          # ANCM writes startup failures here. Keep the directory in the artifact so
          # shared IIS hosting can create stdout logs before the application starts.
          $logsPath = Join-Path '${{ env.PUBLISH_PATH }}' 'logs'
          New-Item -ItemType Directory -Path $logsPath -Force | Out-Null
          Set-Content -Path (Join-Path $logsPath 'keep.txt') -Value '' -Encoding UTF8

      - uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: ${{ env.PUBLISH_PATH }}/

  build-web:
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.ANGULAR_WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.ANGULAR_WORKING_DIR }}
        run: npm ci

      - name: Point the client at the API origin
        working-directory: ${{ env.ANGULAR_WORKING_DIR }}
        shell: pwsh
        env:
          API_ORIGIN: ${{ vars.API_ORIGIN }}
        run: |
          $apiOrigin = if ([string]::IsNullOrWhiteSpace($env:API_ORIGIN)) { '${{ env.DEFAULT_API_ORIGIN }}' } else { $env:API_ORIGIN }
          $apiOrigin = $apiOrigin.Trim().TrimEnd('/').TrimEnd('.')

          # Built as an array rather than a here-string, whose terminator cannot be indented.
          $lines = @(
            'export const environment = {',
            '    production: true,',
            "    apiBaseUrl: '$apiOrigin',",
            '};'
          )

          Set-Content -Path 'src/environments/environment.production.ts' -Value $lines -Encoding UTF8
          Write-Host "Client will call $apiOrigin"

      - name: Build Angular app
        working-directory: ${{ env.ANGULAR_WORKING_DIR }}
        run: npm run build

      - name: Copy the SPA rewrite rules into the output
        working-directory: ${{ env.ANGULAR_WORKING_DIR }}
        run: |
          target=$(dirname "$(find dist -name index.html | head -n 1)")
          cp src/web.config "$target/web.config"

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: ${{ env.ANGULAR_DIST_PATH }}/

  deploy-api:
    needs: [detect-changes, build-api]
    if: needs.detect-changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api-publish
          path: ${{ env.PUBLISH_PATH }}/

      - name: Prepare app offline marker
        shell: pwsh
        run: |
          $offlineDir = './api-offline-payload'
          New-Item -ItemType Directory -Path $offlineDir -Force | Out-Null
          Set-Content -Path (Join-Path $offlineDir 'app_offline.htm') -Value '<html><body>Updating Liga Cup API...</body></html>' -Encoding UTF8

      - name: Stop API before replacing files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ env.FTP_PROTOCOL }}
          local-dir: ./api-offline-payload/
          server-dir: ${{ env.API_SERVER_DIR }}
          dangerous-clean-slate: false

      - name: Wait for API worker to stop
        run: sleep 5

      - name: Deploy API over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ env.FTP_PROTOCOL }}
          local-dir: ${{ env.PUBLISH_PATH }}/
          server-dir: ${{ env.API_SERVER_DIR }}
          dangerous-clean-slate: false
          # The live SQLite database and its journals must survive every deploy.
          exclude: |
            **/App_Data/**
            **/*.db
            **/*.db-shm
            **/*.db-wal
            **/.git*
            **/node_modules/**

      - name: Remove API offline marker
        shell: pwsh
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          $server = $env:FTP_SERVER
          $serverDir = '${{ env.API_SERVER_DIR }}'.Trim('/')
          $uri = "ftp://$server/$serverDir/app_offline.htm"
          $request = [System.Net.FtpWebRequest]::Create($uri)
          $request.Method = [System.Net.WebRequestMethods+Ftp]::DeleteFile
          $request.Credentials = New-Object System.Net.NetworkCredential($env:FTP_USERNAME, $env:FTP_PASSWORD)
          $request.UseBinary = $true
          $request.KeepAlive = $false
          try {
            $response = $request.GetResponse()
            $response.Close()
          } catch {
            if ($_.Exception.Message -notmatch '550') { throw }
          }

      - name: Wait for API to restart
        run: sleep 8

  verify-api:
    needs: deploy-api
    if: needs.deploy-api.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the API to restart
        run: sleep 10

      - name: Check API health
        id: health
        continue-on-error: true
        run: curl --fail --retry 5 --retry-delay 5 --retry-all-errors --verbose '${{ env.DEFAULT_API_ORIGIN }}/api/health'

      - name: Download API startup logs after health failure
        if: steps.health.outcome == 'failure'
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          mkdir -p remote-api-logs
          curl --fail --silent --show-error --user "$FTP_USERNAME:$FTP_PASSWORD" --ftp-ssl \
            "ftp://$FTP_SERVER/ligacup.api/logs/" --list-only > remote-api-logs/index.txt || true
          while read -r log; do
            [ -z "$log" ] && continue
            curl --fail --silent --show-error --user "$FTP_USERNAME:$FTP_PASSWORD" --ftp-ssl \
              "ftp://$FTP_SERVER/ligacup.api/logs/$log" -o "remote-api-logs/$log" || true
          done < remote-api-logs/index.txt
          cat remote-api-logs/*.log 2>/dev/null || true

      - name: Fail when API health check failed
        if: steps.health.outcome == 'failure'
        run: exit 1

  deploy-web:
    needs: [detect-changes, build-web]
    if: needs.detect-changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: ./web-dist/

      - name: Deploy web over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ env.FTP_PROTOCOL }}
          local-dir: ./web-dist/
          server-dir: ${{ env.WEB_SERVER_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/node_modules/**
